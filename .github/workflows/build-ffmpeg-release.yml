name: Build Patched FFmpeg-Git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo (lấy file nvenc-runtime-api.patch)
        uses: actions/checkout@v4

      - name: Cập nhật hệ thống, cấu hình build nhanh và tắt Debug
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo

          # 1. Tận dụng tối đa CPU để build nhanh
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf

          # 2. TẮT TẠO GÓI DEBUG: Chuyển 'debug' thành '!debug'
          sed -i 's/\bdebug\b/!debug/g' /etc/makepkg.conf

      - name: Tạo người dùng builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          sed -i 's/\r$//' nvenc-runtime-api.patch
          cp nvenc-runtime-api.patch /home/builder/
          chown -R builder:builder /home/builder

      - name: Cài đặt gói ffnvcodec-headers13.0 từ AUR
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffnvcodec-headers13.0.git
            cd ffnvcodec-headers13.0
            makepkg -si --noconfirm
          '

      - name: Chuẩn bị mã nguồn ffmpeg-git và chèn patch
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffmpeg-git.git
            cd ffmpeg-git

            cp /home/builder/nvenc-runtime-api.patch .

            # 1. Chèn patch runtime NVENC
            sed -i "/prepare() {/a \  patch -Np1 -d ffmpeg -i \"\$startdir/nvenc-runtime-api.patch\"" PKGBUILD

            # 2. Tắt AMF (tránh lỗi configure: amf requested but not found)
            sed -i "s/--enable-amf/--disable-amf/g" PKGBUILD

            # 3. Ghim đúng commit FFmpeg cũ (tránh upstream đổi code làm gãy patch NVENC)
            # sed -i -E "s|(git\+https://[^[:space:]]*ffmpeg\.git)|\1#commit=46f23be8b1|gi" PKGBUILD

            # 4. Khóa phiên bản các thư viện .so (để lần sau Arch update như libplacebo thì pacman báo trước, không làm hỏng mpv)
            # sed -i "/^package[a-z0-9_-]*() {/a \  depends+=(libass.so libbluray.so libbs2b.so libdav1d.so libfreetype.so libharfbuzz.so libjxl.so libopenmpt.so libplacebo.so librav1e.so librsvg-2.so librubberband.so libva.so libva-drm.so libva-x11.so libvidstab.so libvorbisenc.so libvorbis.so libvpx.so libx264.so libx265.so libxvidcore.so libzimg.so libzmq.so)" PKGBUILD
          '

      - name: Biên dịch ffmpeg-git (chỉ tạo gói chính)
        run: |
          su builder -c '
            cd /home/builder/ffmpeg-git
            makepkg -s --noconfirm
          '

      - name: Upload duy nhất gói cài đặt chính (~15MB)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-git-pascal-package
          # Chỉ lấy duy nhất file gói cài đặt chính, bỏ qua mọi file phụ khác
          path: /home/builder/ffmpeg-git/ffmpeg-git-[0-9]*.pkg.tar.zst
