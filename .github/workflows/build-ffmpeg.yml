name: Build Patched FFmpeg-Git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo (lấy file nvenc-runtime-api.patch)
        uses: actions/checkout@v4

      - name: Cập nhật hệ thống & Cài đặt công cụ nền tảng
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo

      - name: Tạo người dùng builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          cp nvenc-runtime-api.patch /home/builder/
          chown -R builder:builder /home/builder

      - name: Cài đặt nv-codec-headers 13.0
        run: |
          su builder -c '
            cd /home/builder
            git clone https://github.com/FFmpeg/nv-codec-headers.git
            cd nv-codec-headers
            # Check out bản phát hành nhánh 13.0
            git checkout $(git tag -l "n13.0.*" | sort -V | tail -n 1)
            sudo make PREFIX=/usr install
          '

      - name: Khai báo ffnvcodec-headers đã cài đặt vào pacman
        run: |
          # Báo cho pacman biết ffnvcodec-headers đã có trên máy
          # để pacman không kéo bản khác từ repo đè lên bản 13.0
          echo "AssumeInstalled = ffnvcodec-headers" >> /etc/pacman.conf

      - name: Chuẩn bị mã nguồn và chèn patch
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffmpeg-git.git
            cd ffmpeg-git

            # Copy file patch vào thư mục PKGBUILD ($startdir)
            cp /home/builder/nvenc-runtime-api.patch .

            # Chèn lệnh áp patch vào hàm prepare()
            sed -i "/prepare() {/a \  patch -Np1 -d ffmpeg -i \"\$startdir/nvenc-runtime-api.patch\"" PKGBUILD
          '

      - name: Cài đặt toàn bộ dependencies và biên dịch ffmpeg-git
        run: |
          su builder -c '
            cd /home/builder/ffmpeg-git
            # -s: Tự động tải nasm và tất cả phụ thuộc còn lại từ kho Arch
            # Không dùng cờ -d để đảm bảo không bị thiếu nasm
            makepkg -s --noconfirm
          '

      - name: Upload gói cài đặt (.pkg.tar.zst)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-git-pascal-package
          path: /home/builder/ffmpeg-git/*.pkg.tar.zst
