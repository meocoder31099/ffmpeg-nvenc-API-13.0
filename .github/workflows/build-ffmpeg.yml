name: Build Patched FFmpeg-Git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo (lấy file nvenc-runtime-api.patch)
        uses: actions/checkout@v4

      - name: Cập nhật hệ thống & Cài đặt công cụ nền tảng
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo
          # Tối ưu dùng toàn bộ core CPU của GitHub Runner để build nhanh
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf

      - name: Tạo người dùng builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # Chuyển file patch và loại bỏ ký tự xuống dòng Windows (\r) nếu có
          sed -i 's/\r$//' nvenc-runtime-api.patch
          cp nvenc-runtime-api.patch /home/builder/
          chown -R builder:builder /home/builder

      - name: Cài đặt gói ffnvcodec-headers13.0 trực tiếp từ AUR
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffnvcodec-headers13.0.git
            cd ffnvcodec-headers13.0
            # makepkg -si tự động build và cài đặt vào hệ thống pacman
            makepkg -si --noconfirm
          '

      - name: Chuẩn bị mã nguồn ffmpeg-git và chèn patch
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffmpeg-git.git
            cd ffmpeg-git

            # Copy file patch vào thư mục PKGBUILD ($startdir)
            cp /home/builder/nvenc-runtime-api.patch .

            # Chèn lệnh apply patch vào hàm prepare()
            sed -i "/prepare() {/a \  patch -Np1 -d ffmpeg -i \"\$startdir/nvenc-runtime-api.patch\"" PKGBUILD
          '

      - name: Tự động kéo dependencies (nasm, clang, ...) và biên dịch ffmpeg-git
        run: |
          su builder -c '
            cd /home/builder/ffmpeg-git
            # Gói ffnvcodec-headers13.0 đã cung cấp sẵn ffnvcodec-headers
            # makepkg -s sẽ chỉ tải nasm và các công cụ còn thiếu từ repo chính thức
            makepkg -s --noconfirm
          '

      - name: Upload gói cài đặt (.pkg.tar.zst)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-git-pascal-package
          path: /home/builder/ffmpeg-git/*.pkg.tar.zst
