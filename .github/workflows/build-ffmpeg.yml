name: Build Patched FFmpeg-Git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo (lấy file nvenc-runtime-api.patch)
        uses: actions/checkout@v4

      - name: Cập nhật hệ thống & Cài đặt công cụ nền tảng
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo
          # Tối ưu tốc độ build FFmpeg bằng toàn bộ số core CPU
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc)"/' /etc/makepkg.conf

      - name: Tạo người dùng builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          # Chuyển file patch và đổi sang định dạng ký tự Unix
          sed -i 's/\r$//' nvenc-runtime-api.patch
          cp nvenc-runtime-api.patch /home/builder/
          chown -R builder:builder /home/builder

      - name: Đóng gói và cài đặt ffnvcodec-headers 13.0 chuẩn Arch
        run: |
          su builder -c '
            mkdir -p /home/builder/nv-pkg
            cd /home/builder/nv-pkg

            # Tải mã nguồn nv-codec-headers 13.0
            git clone https://github.com/FFmpeg/nv-codec-headers.git
            cd nv-codec-headers
            TAG=$(git tag -l "n13.0.*" | sort -V | tail -n 1)
            git checkout "$TAG"
            VER="${TAG#n}"
            cd ..

            # Tạo PKGBUILD đóng gói ffnvcodec-headers
            cat <<EOF > PKGBUILD
          pkgname=ffnvcodec-headers
          pkgver=${VER}
          pkgrel=1
          pkgdesc="FFmpeg version of headers required for NVENC (13.0)"
          arch=("any")
          license=("MIT")
          package() {
            cd nv-codec-headers
            make PREFIX=/usr DESTDIR="\$pkgdir" install
          }
          EOF

            # Build gói và cài vào database pacman
            makepkg -f --noconfirm
            sudo pacman -U --noconfirm ffnvcodec-headers-*.pkg.tar.zst
          '

      - name: Chuẩn bị mã nguồn và chèn patch
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffmpeg-git.git
            cd ffmpeg-git

            # Copy file patch vào thư mục PKGBUILD ($startdir)
            cp /home/builder/nvenc-runtime-api.patch .

            # Chèn lệnh áp patch vào hàm prepare()
            sed -i "/prepare() {/a \  patch -Np1 -d ffmpeg -i \"\$startdir/nvenc-runtime-api.patch\"" PKGBUILD
          '

      - name: Tự động tải dependencies (nasm, ...) và biên dịch ffmpeg-git
        run: |
          su builder -c '
            cd /home/builder/ffmpeg-git
            # makepkg -s sẽ kéo đầy đủ nasm và các phụ thuộc khác mà không đụng tới ffnvcodec-headers
            makepkg -s --noconfirm
          '

      - name: Upload gói cài đặt (.pkg.tar.zst)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-git-pascal-package
          path: /home/builder/ffmpeg-git/*.pkg.tar.zst
