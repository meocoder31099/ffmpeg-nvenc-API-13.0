name: Build Patched FFmpeg-Git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo này (để lấy file nvenc-runtime-api.patch)
        uses: actions/checkout@v4

      - name: Khởi tạo hệ thống Arch Linux & Cài công cụ cơ bản
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo

      - name: Tạo người dùng builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          cp nvenc-runtime-api.patch /home/builder/
          chown -R builder:builder /home/builder

      - name: Cài đặt nv-codec-headers 13.0 (Bắt buộc cho patch)
        run: |
          su builder -c '
            cd /home/builder
            git clone https://github.com/FFmpeg/nv-codec-headers.git
            cd nv-codec-headers
            # Check out bản phát hành nhánh 13.0
            git checkout $(git tag -l "n13.0.*" | tail -n 1)
            make
            sudo make install
          '

      - name: Clone ffmpeg-git AUR, áp bản patch và chỉnh sửa PKGBUILD
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/ffmpeg-git.git
            cd ffmpeg-git

            # Copy file patch vào thư mục ffmpeg-git
            cp /home/builder/nvenc-runtime-api.patch .

            # Thêm patch vào source() của PKGBUILD và bỏ check sha256 cho patch
            sed -i "/source=(/a \        \"nvenc-runtime-api.patch\"" PKGBUILD
            sed -i "/b2sums=(/a \        \"SKIP\"" PKGBUILD

            # Thêm lệnh apply patch vào hàm prepare() trong PKGBUILD
            sed -i "/prepare() {/a \  patch -Np1 -d ffmpeg -i \"\$srcdir/nvenc-runtime-api.patch\"" PKGBUILD

            # Xóa ffnvcodec-headers khỏi makedepends để tránh pacman ghi đè bản 13.0 vừa cài
            sed -i "s/ffnvcodec-headers//g" PKGBUILD
          '

      - name: Biên dịch gói ffmpeg-git
        run: |
          su builder -c '
            cd /home/builder/ffmpeg-git
            # makepkg -s: tự động kéo các dependency còn lại từ kho Arch
            # makepkg -d: không check ffnvcodec-headers vì đã cài thủ công ở bước trên
            makepkg -sd --noconfirm
          '

      - name: Đóng gói và Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-git-pascal-patched
          path: /home/builder/ffmpeg-git/*.pkg.tar.zst
